name: End to End Testing

# E2E provisions resources inside a kind-hosted control plane. No external API
# or credentials are involved and nothing is billable, so it is still never a
# push/PR gate — provisioning costs real time and CPU. Instead it is
# triggered on demand by commenting on a pull request:
#
#   /test-examples="examples/vpc,examples/instance"
#
# Only collaborators with write or admin permission can trigger it. The result
# is reported back onto the PR head commit as an "Uptest-<hash>" status check.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read       # actions/checkout (get-example-list, uptest jobs)
  pull-requests: read  # GET /repos/{}/pulls/{number} -- verify PR head SHA
  statuses: write       # POST /repos/{}/statuses/{sha} -- pending/success/failure checks

jobs:
  check-permissions:
    runs-on: ubuntu-latest
    outputs:
      permission: ${{ steps.check-permissions.outputs.permission }}
    steps:
      - name: Get Commenter Permissions
        id: check-permissions
        env:
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          echo "Trigger keyword: '/test-examples'"

          # GET /repos/{}/collaborators/{}/permission needs no entry in
          # permissions: above -- it is covered by the "metadata: read"
          # every GITHUB_TOKEN carries implicitly. A 200 response (including
          # permission: "none" for a non-collaborator) is the legitimate-deny
          # path; any other status is a call failure -- most often the token
          # missing a scope it needs -- and must be reported loudly rather
          # than read as a deny.
          HTTP_STATUS=$(curl -s -o /tmp/collab-permission.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/collaborators/$COMMENTER/permission")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GET /repos/$REPO/collaborators/$COMMENTER/permission returned HTTP $HTTP_STATUS, not 200 -- body: $(cat /tmp/collab-permission.json)" >&2
            exit 1
          fi

          GRANTED=$(jq -r .permission /tmp/collab-permission.json)

          # Make it accessible in the workflow via a job output -- cannot use env
          echo "User $COMMENTER has $GRANTED permissions"
          echo "permission=$GRANTED" >> "$GITHUB_OUTPUT"

  get-example-list:
    needs: check-permissions
    if: ${{ (needs.check-permissions.outputs.permission == 'admin' || needs.check-permissions.outputs.permission == 'write') && github.event.issue.pull_request != null && contains(github.event.comment.body, '/test-examples') }}
    runs-on: ubuntu-latest
    outputs:
      example_list: ${{ steps.get-example-list-name.outputs.example-list }}
      example_hash: ${{ steps.get-example-list-name.outputs.example-hash }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
          submodules: recursive

      - name: Verify PR Head SHA
        id: checkout-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git log -1 --format='%H')
          # GET /repos/{}/pulls/{number} -- needs pull-requests: read (see
          # permissions: above).
          API_SHA=$(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$CHECKED_OUT_SHA" != "$API_SHA" ]; then
            echo "::error::Checked-out SHA ($CHECKED_OUT_SHA) does not match the PR head reported by the API ($API_SHA); the PR may have been updated mid-run." >&2
            exit 1
          fi
          echo "commit-sha=$CHECKED_OUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare The Example List
        env:
          COMMENT: ${{ github.event.comment.body }}
        id: get-example-list-name
        run: |
          set -euo pipefail

          # Require the quoted form so a bare "/test-examples" can never fall
          # through and launch the full (expensive) example set.
          if ! echo "$COMMENT" | grep -q '/test-examples="'; then
            echo "::error::Malformed command. Expected: /test-examples=\"examples/vpc,examples/instance\"" >&2
            exit 1
          fi

          PATHS=$(echo "$COMMENT" | sed 's/^.*\/test-examples="//g' | cut -d '"' -f 1 | sed 's/,/ /g')

          EXAMPLE_FILES=""
          for P in $PATHS; do
            if [ ! -e "$P" ]; then
              echo "::error::No such example path in this PR: $P" >&2
              exit 1
            fi
            EXAMPLE_FILES="${EXAMPLE_FILES}$(find "$P" -name '*.yaml' | sort)"$'\n'
          done

          # Build the list newline-separated across all paths and join once,
          # dropping any blank lines left by an empty path expansion — this
          # is the only join, so no per-iteration comma is ever produced.
          EXAMPLE_LIST=$(printf '%s\n' "$EXAMPLE_FILES" | sed '/^$/d' | paste -sd, -)

          if [ -z "$EXAMPLE_LIST" ]; then
            echo "::error::Resolved example list is empty for paths: $PATHS" >&2
            exit 1
          fi

          sudo apt-get -y install coreutils
          EXAMPLE_HASH=$(echo "$EXAMPLE_LIST" | md5sum | cut -f1 -d" ")

          echo "Examples: ${EXAMPLE_LIST}"
          echo "Example Hash: ${EXAMPLE_HASH}"

          echo "example-list=${EXAMPLE_LIST}" >> $GITHUB_OUTPUT
          echo "example-hash=${EXAMPLE_HASH}" >> $GITHUB_OUTPUT

      - name: Create Pending Status Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.checkout-pr.outputs.commit-sha }}
          RUN_ID: ${{ github.run_id }}
          EXAMPLE_HASH: ${{ steps.get-example-list-name.outputs.example-hash }}
        run: |
          # POST /repos/{}/statuses/{sha} -- needs statuses: write (see
          # permissions: above).
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/statuses/$COMMIT_SHA" \
            -f state='pending' \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" \
            -f description='Running...' \
            -f context="Uptest-${EXAMPLE_HASH}"

  uptest:
    needs:
      - check-permissions
      - get-example-list
    if: ${{ (needs.check-permissions.outputs.permission == 'admin' || needs.check-permissions.outputs.permission == 'write') && github.event.issue.pull_request != null && contains(github.event.comment.body, '/test-examples') }}
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          swap-storage: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: 'v0.23.0'
          install: true

      - name: Checkout PR
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
          submodules: recursive

      - name: Verify PR Head SHA
        id: checkout-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA=$(git log -1 --format='%H')
          # GET /repos/{}/pulls/{number} -- needs pull-requests: read (see
          # permissions: above).
          API_SHA=$(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          if [ "$CHECKED_OUT_SHA" != "$API_SHA" ]; then
            echo "::error::Checked-out SHA ($CHECKED_OUT_SHA) does not match the PR head reported by the API ($API_SHA); the PR may have been updated mid-run." >&2
            exit 1
          fi
          echo "commit-sha=$CHECKED_OUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Run Uptest
        id: run-uptest
        env:
          # For providers whose E2E needs live API credentials, this is
          # consumed by test/setup.sh to create the Secret + ProviderConfigs,
          # and e2e-preflight gates on it being set. Providers whose E2E runs
          # entirely against a simulator (no live backend) don't read this var
          # at all and their e2e-preflight doesn't gate on it -- check this
          # provider's own test/setup.sh and e2e-preflight recipe for what is
          # actually enforced. Either way the GitHub secret must exist before
          # this workflow is dispatched, or leaving it unset is the deliberate
          # choice for a simulator-only provider.
          UPTEST_INPUT_MANIFESTS: ${{ needs.get-example-list.outputs.example_list }}
        run: |
          make e2e

      - name: Create Successful Status Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.checkout-pr.outputs.commit-sha }}
          RUN_ID: ${{ github.run_id }}
          EXAMPLE_HASH: ${{ needs.get-example-list.outputs.example_hash }}
        run: |
          # POST /repos/{}/statuses/{sha} -- needs statuses: write (see
          # permissions: above).
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/statuses/$COMMIT_SHA" \
            -f state='success' \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" \
            -f description='Passed' \
            -f context="Uptest-${EXAMPLE_HASH}"

      - name: Collect Cluster Dump
        if: always()
        run: |
          make controlplane.dump

      - name: Upload Cluster Dump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controlplane-dump
          path: ./_output/controlplane-dump

      # Belt and braces: uptest deletes what it created, but a timeout or a
      # crashed run can leave stray kind-hosted resources behind (nothing billable).
      - name: Cleanup
        if: always()
        timeout-minutes: 7
        run: |
          eval $(make --no-print-directory build.vars)

          # The category may not be registered at all if the run failed
          # before the CRDs were ever installed -- that is "nothing was
          # created", not a leak, and must not fail this step.
          LIST_STATUS=0
          LIST_OUTPUT=$(${KUBECTL} get managed --all-namespaces -o name 2>&1) || LIST_STATUS=$?

          if [ "$LIST_STATUS" -ne 0 ]; then
            if echo "$LIST_OUTPUT" | grep -q "the server doesn't have a resource type"; then
              echo "No 'managed' resource type registered -- nothing to clean up."
              exit 0
            fi
            echo "::error::kubectl get managed failed: $LIST_OUTPUT"
            exit 1
          fi

          if [ -z "$LIST_OUTPUT" ]; then
            echo "No managed resources found, cluster-scoped or namespaced -- nothing to clean up."
            exit 0
          fi

          echo "Deleting managed resources (both cluster-scoped and namespaced):"
          echo "$LIST_OUTPUT"

          # Both scopes are selected by ONE command so every delete request
          # goes out before this blocks on any finalizer wait -- a step
          # killed mid-wait then still leaves every object's deletion
          # already in flight, rather than one whole scope never even asked
          # to delete. The finalizer is what issues the real backend
          # delete, so this deliberately does not return before that
          # finishes: the runner is torn down the moment this step ends,
          # and anything still mid-finalizer at that point is lost for
          # good. The bounded --timeout stops a stuck finalizer from
          # holding the job open indefinitely; exceeding it is reported as
          # the real failure it is, never swallowed.
          ${KUBECTL} delete managed --all --all-namespaces --timeout=300s

      - name: Create Unsuccessful Status Check
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.checkout-pr.outputs.commit-sha }}
          RUN_ID: ${{ github.run_id }}
          EXAMPLE_HASH: ${{ needs.get-example-list.outputs.example_hash }}
        run: |
          # POST /repos/{}/statuses/{sha} -- needs statuses: write (see
          # permissions: above).
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/statuses/$COMMIT_SHA" \
            -f state='failure' \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" \
            -f description='Failed' \
            -f context="Uptest-${EXAMPLE_HASH}"
