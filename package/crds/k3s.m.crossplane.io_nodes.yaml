---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: nodes.k3s.m.crossplane.io
spec:
  group: k3s.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - k3s
    kind: Node
    listKind: NodeList
    plural: nodes
    singular: node
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A Node joins a machine to an existing k3s cluster as an agent
          or server via SSH.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A NodeSpec defines the desired state of a Node.
            properties:
              driftDetection:
                description: |-
                  DriftDetection configures which forProvider fields are owned outside
                  Crossplane and how drift in those fields is detected and corrected.
                  Absent configuration means drift detection is enabled with no
                  ignored paths -- today's behaviour.
                properties:
                  ignore:
                    description: Ignore declares fields owned outside Crossplane.
                    items:
                      description: |-
                        IgnoreRule declares fields whose value is owned by something other than
                        Crossplane. Listed fields are seeded from spec on create, then neither
                        compared nor written from spec: the value observed on the external
                        resource is carried forward instead.
                      properties:
                        paths:
                          description: |-
                            Paths to ignore, in Crossplane field path notation rooted at the
                            managed resource spec, for example forProvider.k3sVersion. This is
                            the grammar Composition patches use; JSON Pointer form
                            (/forProvider/k3sVersion) is also accepted. List indices and
                            wildcards are not supported -- ignore the whole list instead.
                          items:
                            type: string
                          type: array
                      type: object
                    type: array
                  mode:
                    default: enabled
                    description: Mode selects the drift detection behaviour.
                    enum:
                    - enabled
                    - warn
                    - disabled
                    type: string
                type: object
              forProvider:
                description: NodeParameters are the configurable fields of a Node.
                properties:
                  cluster:
                    description: |-
                      Cluster is the resolved Kubernetes object name of the Cluster this
                      node joins, populated from ClusterRef or ClusterSelector. Changing
                      the resolved cluster after creation would mean leaving one cluster
                      and joining another, which this provider does not attempt as an
                      in-place update.
                    type: string
                    x-kubernetes-validations:
                    - message: cluster is immutable once set
                      rule: self == oldSelf || oldSelf == ''
                  clusterRef:
                    description: |-
                      ClusterRef references the Cluster resource this node joins, by name.
                      A namespace omitted here defaults to the Node's own namespace.
                      Required when managementPolicies allows Create or Update (see the
                      root-level CEL rule on Node) unless clusterSelector is set instead --
                      Observe only needs host to address the object, per convention.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: clusterRef is immutable after creation
                      rule: self == oldSelf
                  clusterSelector:
                    description: |-
                      ClusterSelector selects the Cluster resource this node joins, by
                      label match. A namespace omitted here defaults to the Node's own
                      namespace.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                  extraArgs:
                    description: ExtraArgs are additional arguments passed to k3s.
                    type: string
                  host:
                    description: |-
                      Host is the DNS name or IP address of the target machine. It is the
                      SSH connection target and the sole identity this provider has for the
                      joined node; it cannot be changed after creation.
                    type: string
                    x-kubernetes-validations:
                    - message: host is immutable after creation
                      rule: self == oldSelf
                  k3sChannel:
                    default: stable
                    description: K3sChannel is the release channel.
                    type: string
                  k3sVersion:
                    description: K3sVersion is the specific k3s version to install.
                    type: string
                  port:
                    default: 22
                    description: |-
                      Port is the SSH port. Defaults to 22. It addresses the same SSH
                      connection target as host and cannot be changed after creation.
                    type: integer
                    x-kubernetes-validations:
                    - message: port is immutable after creation
                      rule: self == oldSelf
                  role:
                    description: |-
                      Role is the role of this node: "agent" (worker) or "server" (additional control plane).
                      Required when managementPolicies allows Create or Update (see the
                      root-level CEL rule on Node) -- Observe only needs host to address
                      the object. Switching a joined node's role requires leaving and
                      rejoining, which this provider does not attempt as an in-place
                      update.
                    enum:
                    - agent
                    - server
                    type: string
                    x-kubernetes-validations:
                    - message: role is immutable after creation
                      rule: self == oldSelf
                  tlsSAN:
                    description: TLSSAN adds an additional TLS SAN (only applicable
                      for server role).
                    type: string
                required:
                - host
                type: object
                x-kubernetes-validations:
                - message: port cannot be removed once set
                  rule: '!has(oldSelf.port) || has(self.port)'
                - message: clusterRef cannot be removed once set
                  rule: '!has(oldSelf.clusterRef) || has(self.clusterRef)'
                - message: cluster cannot be removed once set
                  rule: '!has(oldSelf.cluster) || has(self.cluster)'
                - message: role cannot be removed once set
                  rule: '!has(oldSelf.role) || has(self.role)'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A NodeStatus represents the observed state of a Node.
            properties:
              atProvider:
                description: NodeObservation are the observable fields of a Node.
                properties:
                  cluster:
                    description: |-
                      Cluster mirrors spec.forProvider.cluster: the resolved Kubernetes
                      object name of the Cluster this node joined. Immutable once set, so
                      it cannot diverge from spec once the resource exists.
                    type: string
                  extraArgs:
                    description: |-
                      ExtraArgs mirrors the value this controller most recently confirmed
                      it applied. Empty until the first successful Create or Update.
                    type: string
                  host:
                    description: |-
                      Host mirrors spec.forProvider.host: the SSH target this Node was
                      joined on. Immutable, so it cannot diverge from spec once the
                      resource exists.
                    type: string
                  id:
                    description: |-
                      ID is this resource's identity, mirrored from the external-name
                      annotation once Observe or Create has run. Uptest's import recovery
                      test compares this against the external-name recorded before the
                      resource's status was cleared.
                    type: string
                  k3sChannel:
                    description: |-
                      K3sChannel mirrors the release channel this controller most
                      recently confirmed it applied. Empty until the first successful
                      Create or Update: the k3s join script reports no channel of its
                      own, so there is nothing to mirror before this controller has
                      recorded one.
                    type: string
                  k3sVersion:
                    description: K3sVersion is the installed version reported by the
                      node.
                    type: string
                  port:
                    description: |-
                      Port mirrors spec.forProvider.port. Immutable, so it cannot diverge
                      from spec once the resource exists.
                    type: integer
                  ready:
                    description: Ready indicates the node has successfully joined
                      the cluster.
                    type: boolean
                  role:
                    description: |-
                      Role is the observed role of the node. Immutable, so it cannot
                      diverge from spec once the resource exists.
                    type: string
                  tlsSAN:
                    description: |-
                      TLSSAN mirrors the value this controller most recently confirmed it
                      applied. Empty until the first successful Create or Update.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: clusterRef or clusterSelector is required when managementPolicies
            allows Create or Update
          rule: '!has(self.spec) || !has(self.spec.managementPolicies) || !(''*''
            in self.spec.managementPolicies || ''Create'' in self.spec.managementPolicies
            || ''Update'' in self.spec.managementPolicies) || has(self.spec.forProvider.clusterRef)
            || has(self.spec.forProvider.clusterSelector)'
        - message: role is required when managementPolicies allows Create or Update
          rule: '!has(self.spec) || !has(self.spec.managementPolicies) || !(''*''
            in self.spec.managementPolicies || ''Create'' in self.spec.managementPolicies
            || ''Update'' in self.spec.managementPolicies) || has(self.spec.forProvider.role)'
    served: true
    storage: true
    subresources:
      status: {}
